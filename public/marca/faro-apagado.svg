<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Faro apagado</title>
  <!-- Faro Año Nuevo apagado: sin haces, linterna oscura y grieta. Para la página 404. -->
  <clipPath id="faro-off">
    <rect width="64" height="64" rx="12"/>
  </clipPath>
  <rect width="64" height="64" rx="12" fill="#001F3F"/>
  <g clip-path="url(#faro-off)">
    <!-- Sea -->
    <rect y="50" width="64" height="14" fill="#005B99"/>
    <path d="M0,50 Q8,46 16,50 T32,50 T48,50 T64,50 V54 H0 Z" fill="#007BFF" opacity="0.4"/>
    <!-- Tower silhouette (unlit: no beams) -->
    <polygon points="27,52 37,52 34,22 30,22" fill="#003366"/>
    <rect x="28.2" y="40" width="7.6" height="6" fill="#F4F8FB" opacity="0.85"/>
    <rect x="29.4" y="28" width="5.2" height="6" fill="#F4F8FB" opacity="0.85"/>
    <!-- Crack -->
    <polyline points="31,30 29.5,35 31.5,40 30,45" fill="none" stroke="#A8DADC" stroke-width="1" opacity="0.8"/>
    <!-- Gallery platform + railing -->
    <rect x="28" y="19.5" width="8" height="2.5" fill="#003366"/>
    <line x1="29" y1="14.5" x2="29" y2="19.5" stroke="#003366" stroke-width="0.9"/>
    <line x1="32" y1="14.5" x2="32" y2="19.5" stroke="#003366" stroke-width="0.9"/>
    <line x1="35" y1="14.5" x2="35" y2="19.5" stroke="#003366" stroke-width="0.9"/>
    <rect x="28.6" y="13.8" width="6.8" height="1" fill="#003366"/>
    <!-- Lantern off (dim glass) -->
    <rect x="30.2" y="8.5" width="3.6" height="5" fill="#5d7a8c"/>
    <polygon points="29.4,8.5 34.6,8.5 32,5" fill="#003366"/>
    <circle cx="32" cy="4.4" r="0.8" fill="#5d7a8c"/>
    <!-- Keeper house -->
    <rect x="35.5" y="44" width="11.5" height="8" fill="#F4F8FB" opacity="0.85"/>
    <polygon points="34.5,44 48.5,44 41.5,39" fill="#5d7a8c"/>
    <rect x="37" y="47.5" width="2.6" height="4.5" fill="#003366"/>
    <rect x="42.5" y="47" width="2.4" height="2.4" fill="#003366"/>
  </g>
</svg>
