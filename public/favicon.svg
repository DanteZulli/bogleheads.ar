<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Stylized Faro San Juan de Salvamento (Faro del Fin del Mundo) -->
  <rect width="64" height="64" rx="12" fill="#001F3F"/>
  <!-- Light beams -->
  <polygon points="32,17 6,10 6,24" fill="#007BFF" opacity="0.30"/>
  <polygon points="32,17 58,10 58,24" fill="#007BFF" opacity="0.30"/>
  <!-- Sea -->
  <rect y="50" width="64" height="14" fill="#005B99"/>
  <path d="M0,50 Q8,46 16,50 T32,50 T48,50 T64,50 V54 H0 Z" fill="#007BFF" opacity="0.6"/>
  <!-- Tower -->
  <polygon points="27,52 37,52 35,24 29,24" fill="#F4F8FB"/>
  <rect x="28.1" y="37" width="7.8" height="3.4" fill="#003366"/>
  <rect x="28.6" y="29.5" width="6.8" height="3.2" fill="#003366"/>
  <rect x="30.5" y="46" width="3" height="6" fill="#003366"/>
  <!-- Gallery -->
  <rect x="27" y="21.5" width="10" height="3" fill="#003366"/>
  <!-- Lantern glass -->
  <rect x="29.5" y="14" width="5" height="7.5" fill="#A8DADC"/>
  <!-- Roof -->
  <polygon points="28,14 36,14 32,8" fill="#007BFF"/>
  <circle cx="32" cy="7.2" r="1.2" fill="#A8DADC"/>
</svg>
