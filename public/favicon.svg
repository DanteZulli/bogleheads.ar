<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Faro Año Nuevo</title>
  <!-- Faro Año Nuevo (Isla Observatorio): banded tower, gallery, lantern, keeper house -->
  <clipPath id="faro-round">
    <rect width="64" height="64" rx="12"/>
  </clipPath>
  <rect width="64" height="64" rx="12" fill="#001F3F"/>
  <g clip-path="url(#faro-round)">
    <!-- Light beams -->
    <polygon points="32,11 8,6 8,16" fill="#007BFF" opacity="0.25"/>
    <polygon points="32,11 56,6 56,16" fill="#007BFF" opacity="0.25"/>
    <!-- Sea -->
    <rect y="50" width="64" height="14" fill="#005B99"/>
    <path d="M0,50 Q8,46 16,50 T32,50 T48,50 T64,50 V54 H0 Z" fill="#007BFF" opacity="0.6"/>
    <!-- Tower silhouette (navy bands painted over in white) -->
    <polygon points="27,52 37,52 34,22 30,22" fill="#003366"/>
    <rect x="28.2" y="40" width="7.6" height="6" fill="#F4F8FB"/>
    <rect x="29.4" y="28" width="5.2" height="6" fill="#F4F8FB"/>
    <!-- Gallery platform + railing -->
    <rect x="28" y="19.5" width="8" height="2.5" fill="#003366"/>
    <line x1="29" y1="14.5" x2="29" y2="19.5" stroke="#003366" stroke-width="0.9"/>
    <line x1="32" y1="14.5" x2="32" y2="19.5" stroke="#003366" stroke-width="0.9"/>
    <line x1="35" y1="14.5" x2="35" y2="19.5" stroke="#003366" stroke-width="0.9"/>
    <rect x="28.6" y="13.8" width="6.8" height="1" fill="#003366"/>
    <!-- Lantern glass + dome -->
    <rect x="30.2" y="8.5" width="3.6" height="5" fill="#A8DADC"/>
    <polygon points="29.4,8.5 34.6,8.5 32,5" fill="#007BFF"/>
    <circle cx="32" cy="4.4" r="0.8" fill="#A8DADC"/>
    <!-- Keeper house -->
    <rect x="35.5" y="44" width="11.5" height="8" fill="#F4F8FB"/>
    <polygon points="34.5,44 48.5,44 41.5,39" fill="#75AADB"/>
    <rect x="37" y="47.5" width="2.6" height="4.5" fill="#003366"/>
    <rect x="42.5" y="47" width="2.4" height="2.4" fill="#003366"/>
  </g>
</svg>
